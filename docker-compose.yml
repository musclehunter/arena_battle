services:
  app:
    build:
      context: ./docker/php
    container_name: arena_app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db
      - redis
    environment:
      # Laravel 側の .env が優先だが、未設定時のフォールバックとして置く
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: arena
      DB_USERNAME: arena
      DB_PASSWORD: arena
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - arena_net

  web:
    image: nginx:1.27-alpine
    container_name: arena_web
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - arena_net

  vite:
    profiles:
      - dev
    environment:
      VITE_ASSET_BASE_URL: https://pub-acec75c0c97b45aa80aaf02feacb4b8b.r2.dev
    build:
      context: ./docker/php
    container_name: arena_vite
    working_dir: /var/www/html
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
    networks:
      - arena_net

  worker:
    build:
      context: ./docker/php
    container_name: arena_worker
    working_dir: /var/www/html
    entrypoint: ["php"]
    command: ["/var/www/html/scripts/atb_worker.php"]
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - arena_net

  reverb:
    build:
      context: ./docker/php
    container_name: arena_reverb
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - arena_net

  db:
    image: mysql:8.0
    container_name: arena_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: arena
      MYSQL_USER: arena
      MYSQL_PASSWORD: arena
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - arena_net

  redis:
    image: redis:7-alpine
    container_name: arena_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - arena_net

volumes:
  db_data:
  redis_data:

networks:
  arena_net:
    driver: bridge
